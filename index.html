<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pemain · Aethen Roleplay</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="top">
        <a class="brand" href="index.html"><span class="dot"></span>Aethen Roleplay</a>
        <nav>
            <a href="index.html" class="on">Pemain</a>
            <a href="logs.html">Riwayat aksi</a>
        </nav>
        <button class="btn ghost sm" onclick="logout()">Keluar</button>
    </header>

    <main class="wrap">
        <section class="stats">
            <div class="stat"><span>Total karakter</span><strong>1.240</strong></div>
            <div class="stat"><span>Login 24 jam</span><strong>48</strong></div>
            <div class="stat"><span>Login 7 hari</span><strong>310</strong></div>
            <div class="stat"><span>Admin</span><strong>12</strong></div>
        </section>

        <div class="table-wrap card flush">
            <table class="tbl">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nama</th>
                        <th>UCP</th>
                        <th class="r">Level</th>
                        <th class="r">Cash</th>
                        <th class="r">Bank</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="muted">1</td>
                        <td><a class="name" href="player.html?id=1">John_Doe</a></td>
                        <td class="muted">johndoe99</td>
                        <td class="r">15</td>
                        <td class="r gold-t">$5.500.000</td>
                        <td class="r gold-t">$25.000.000</td>
                        <td><span class="badge pink">Admin 3</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="assets/app.js"></script>
</body>
</html>
