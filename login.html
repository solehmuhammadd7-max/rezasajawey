<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk · Aethen Roleplay</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <main class="wrap">
        <div class="login">
          <form class="card login-card" onsubmit="handleLogin(event)">
            <h1>Aethen Roleplay</h1>
            <p class="muted">Panel admin statis untuk GitHub Pages.</p>
            <label>Username<input type="text" id="user" required autofocus></label>
            <label>Password<input type="password" id="pass" required></label>
            <button class="btn" type="submit">Masuk</button>
          </form>
        </div>
    </main>
    <script src="assets/app.js"></script>
</body>
</html>
