<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Riwayat Aksi · Aethen Roleplay</title>
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="top">
        <a class="brand" href="index.html"><span class="dot"></span>Aethen Roleplay Panel</a>
        <nav>
            <a href="index.html">Pemain</a>
            <a href="online.html">Pemain Online <span class="badge green" id="onlineCountBadge">0</span></a>
            <a href="logs.html" class="on">Riwayat Aksi</a>

        <button class="btn ghost sm" onclick="logout()">Keluar</button>

                    <tr>
                        <th>Waktu</th>
                        <th>Admin</th>
                        <th>Aksi</th>

                </thead>
                <tbody id="logsTableBody">
                    <!-- Logs di-render via JS -->
                </tbody>
            </table>
        </div>
    </main>

    <div id="toastContainer" class="toast-container"></div>
    <script src="assets/app.js"></script>
